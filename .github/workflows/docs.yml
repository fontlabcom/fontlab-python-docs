# this_file: .github/workflows/docs.yml
name: Documentation acceptance
on:
  push:
    branches: [master, main, 'docs/**', 'issue-101-ecosystem-docs']
  pull_request:
    branches: [master, main, 'docs/**', 'issue-101-ecosystem-docs']
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: fontlab-python-docs
    steps:
      - name: Check out documentation
        uses: actions/checkout@v4
        with:
          path: fontlab-python-docs
          persist-credentials: false
      # api-sources.lock.json schema 1 pins file bytes, not Git revisions.
      # Producer default branches are checked out; the build rejects byte drift.
      - name: Check out fontlab-echopy
        uses: actions/checkout@v4
        with:
          repository: fontlabcom/fontlab-echopy
          path: fontlab-echopy
          persist-credentials: false
          token: ${{ secrets.FONTLAB_DOCS_READ_TOKEN }}
      - name: Check out pythonqtside
        uses: actions/checkout@v4
        with:
          repository: fontlabcom/pythonqtside
          path: pythonqtside
          persist-credentials: false
          token: ${{ secrets.FONTLAB_DOCS_READ_TOKEN }}
      - name: Check out fontlab-glyport
        uses: actions/checkout@v4
        with:
          repository: fontlabcom/fontlab-glyport
          path: fontlab-glyport
          persist-credentials: false
          token: ${{ secrets.FONTLAB_DOCS_READ_TOKEN }}
      - name: Check out typerig-lib
        uses: actions/checkout@v4
        with:
          repository: fontlabcom/typerig-lib
          path: typerig-lib
          persist-credentials: false
      - name: Check out fontlab-remopy
        uses: actions/checkout@v4
        with:
          repository: fontlabcom/fontlab-remopy
          path: fontlab-remopy
          persist-credentials: false
          token: ${{ secrets.FONTLAB_DOCS_READ_TOKEN }}
      - name: Check out fontlab-fontlabapp
        uses: actions/checkout@v4
        with:
          repository: fontlabcom/fontlab-fontlabapp
          path: fontlab-fontlabapp
          persist-credentials: false
          token: ${{ secrets.FONTLAB_DOCS_READ_TOKEN }}
      - name: Check out fontlab-grablab
        uses: actions/checkout@v4
        with:
          repository: fontlabcom/fontlab-grablab
          path: fontlab-grablab
          persist-credentials: false
          token: ${{ secrets.FONTLAB_DOCS_READ_TOKEN }}
      - name: Check out fontlab-fly
        uses: actions/checkout@v4
        with:
          repository: fontlabcom/fontlab-fly
          path: fontlab-fly
          persist-credentials: false
          token: ${{ secrets.FONTLAB_DOCS_READ_TOKEN }}
      - name: Check out fontlab-aidus-code
        uses: actions/checkout@v4
        with:
          repository: fontlabcom/fontlab-aidus-code
          path: fontlab-aidus-code
          persist-credentials: false
          token: ${{ secrets.FONTLAB_DOCS_READ_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Provision Chromium and system libraries
        run: uv run --no-sync python -m playwright install --with-deps chromium
      - name: Unit and fixture tests
        run: uv run --frozen python -m pytest -q tests
      - name: Build and mandatory consumer acceptance
        run: ./scripts/accept-consumer.sh
      - name: Verify accepted build
        run: ./build.sh --check
      - name: Accessibility acceptance
        run: uv run --no-sync python scripts/a11y_check.py --site .build/site --out a11y.json
      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-receipts
          include-hidden-files: true
          path: |
            fontlab-python-docs/a11y.json
            fontlab-python-docs/.build/*.json
            fontlab-python-docs/.build/browser/*.json
      - name: Upload built site
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          include-hidden-files: true
          path: fontlab-python-docs/.build/site
