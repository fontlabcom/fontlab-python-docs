# this_file: mkdocs.yml
site_name: FontLab Python
site_description: Native Python APIs, remote control, Qt interfaces, and the FontLab scripting ecosystem.
site_url: https://fontlabcom.github.io/fontlab-python-docs/
repo_url: https://github.com/fontlabcom/fontlab-python-docs
edit_uri: ''
use_directory_urls: false
docs_dir: .build/content
site_dir: .build/site
theme:
  name: materialx
  custom_dir: overrides
  search_index_only: true
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
nav:
  - Start: index.md
  - Guide:
      - Install and connect: guide/install.md
      - Native scripting: guide/native.md
      - Panels and drawing: guide/ui.md
      - Glyphs compatibility: guide/glyphs.md
      - PySide2 compatibility: guide/pyside.md
      - Rebuild and contribute: guide/build.md
      - Licences: licenses.md
  - Examples: examples/index.md
  - Reference:
      - API index: reference/index.md
      - fontlab: reference/fontlab.md
      - fontgate: reference/fontgate.md
      - fontpr: reference/fontpr.md
      - fontlabpr: reference/fontlabpr.md
      - PythonQt: reference/PythonQt.md
  - Ecosystem:
      - Echopy: reference/fontlab_echopy.md
      - Fontlabapp: reference/fontlabapp.md
      - Remopy: reference/fontlab_remopy.md
      - Grablab: reference/grablab.md
      - Pythonqtside: reference/pythonqtside.md
      - Fly: reference/fly.md
      - TypeRig: reference/typerig.md
      - Glyport: reference/fontlab_glyport.md
      - Aidus: reference/fontlab_aidus_code.md
  - Shims:
      - FontLab menus and panels: reference/fontlabapp_shim.md
      - GlyphsApp (glyport): reference/GlyphsApp.md
      - vanilla (glyport): reference/vanilla.md
      - AppKit (glyport): reference/AppKit.md
      - Cocoa (glyport): reference/Cocoa.md
      - Foundation (glyport): reference/Foundation.md
      - objc (glyport): reference/objc.md
      - Aidus tools: reference/aidus_code_tools.md
not_in_nav: |
  reference/**
validation:
  nav:
    omitted_files: info
  links:
    not_found: warn
    anchors: warn
markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
plugins:
  - /search:
      lang: en
      separator: '[\s\-]+'
  - autorefs
  - mkdocstrings:
      handlers:
        python:
          paths: []
          options:
            allow_inspection: false
            preload_modules: [fontlab_echopy]
            docstring_style: null
            show_source: false
            show_attribute_values: false
            show_bases: false
            show_root_full_path: false
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            merge_init_into_class: false
            inherited_members: false
extra_css:
  - https://i.fontlab.com/fltheme26/1.0.0/components.css
  - https://i.fontlab.com/fltheme26/1.0.0/theme.css
  - assets/reference.css
extra_javascript:
  - https://i.fontlab.com/fltheme26/1.0.0/basecoat.js
  - https://i.fontlab.com/fltheme26/1.0.0/theme.js
