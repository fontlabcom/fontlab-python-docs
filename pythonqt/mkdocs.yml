copyright:
        "Copyright \xA9 2016\u20132020 <a href=\"http://www.fontlab.com/\">Fontlab\
        \ Ltd.</a>"
docs_dir: srcdocs/mkdocs
extra:
        author:
                twitter: fontlab
        version: 2020.08.06
extra_css:
        - https://i.fontlab.com/fltheme26/1.0.0/components.css
        - https://i.fontlab.com/fltheme26/1.0.0/theme.css
        - style/fontlab_pyapi.css
google_analytics:
        - UA-313999-1
        - auto
markdown_extensions:
        # API bodies are generated HTML; preserve them without prose transformations.
        - abbr
        - attr_list
        - def_list
        - fenced_code
        - footnotes
        - tables
        - admonition
nav:
        - Home: index.md
        - PythonQt: PythonQt.md
        - Qt: PythonQt.Qt.md
        - QtCore: PythonQt.QtCore.md
        - QtGui: PythonQt.QtGui.md
        - QtOpenGL: PythonQt.QtOpenGL.md
        - QtSvg: PythonQt.QtSvg.md
        - QtUiTools: PythonQt.QtUiTools.md
        - QtXml: PythonQt.QtXml.md
        - QtXmlPatterns: PythonQt.QtXmlPatterns.md
        - private: PythonQt.private.md
plugins:
        - /search:
                  lang: en
                  separator: '[\s\-\.]+'
repo_url: https://www.fontlab.com/
site_author: Fontlab Ltd.
site_description: FontLab 7 PythonQt API
site_dir: ../docs/pythonqt
site_name: FontLab 7 PythonQt API
theme:
        custom_dir: overrides
        search_index_only: true
        # MaterialX is used directly.
        logo: https://res.cloudinary.com/fontlab/image/fetch/f_auto,w_48,c_scale/https://www.fontlab.com/img/icon-fontlab-7.png
        name: materialx
        palette:
                primary: deep purple
use_directory_urls: false

extra_javascript:
  - https://i.fontlab.com/fltheme26/1.0.0/basecoat.js
  - https://i.fontlab.com/fltheme26/1.0.0/theme.js

hooks:
  - search_compat.py

site_url: https://fontlabcom.github.io/fontlab-python-docs/pythonqt/
