docs_dir: srcdocs/docs
gens_dir: srcdocs/mkdocs
site_dir: ../docs/pythonqt
pydocmk_pre_dir: srcdocs/pre
pydocmk_post_dir: srcdocs/post
use_directory_urls: false

# Project information
site_name: FontLab 7 PythonQt API
site_description: FontLab 7 PythonQt API
site_author: Fontlab Ltd.
repo_url: https://www.fontlab.com/
# Copyright
copyright: Copyright © 2016–2020 <a href="http://www.fontlab.com/">Fontlab Ltd.</a>
# Documentation and theme
theme:
        custom_dir: overrides
        search_index_only: true
        name: materialx
        # MaterialX is used directly.
        palette:
                primary: deep purple
        logo: "https://res.cloudinary.com/fontlab/image/fetch/f_auto,w_48,c_scale/https://www.fontlab.com/img/icon-fontlab-7.png"
extra_css:
        - https://i.fontlab.com/fltheme26/1.0.0/components.css
        - https://i.fontlab.com/fltheme26/1.0.0/theme.css
        - "style/fontlab_pyapi.css"
plugins:
        - /search:
                  lang: en
                  separator: '[\s\-\.]+'
google_analytics:
        - UA-313999-1
        - auto

# pydocng
#loader:   pydocng.loader.PythonLoader
preprocessor: pydocmk2.preprocessors.pydocmk.Preprocessor

# More
extra:
        version: 2020.08.06
        author:
                twitter: fontlab

markdown_extensions:
        # API bodies are generated HTML; preserve them without prose transformations.
        - abbr
        - attr_list
        - def_list
        - fenced_code
        - footnotes
        - tables
        - admonition
generate:
        - PythonQt.md:
                  - PythonQt++
        - PythonQt.private.md:
                  - PythonQt.private++
        - PythonQt.Qt.md:
                  - PythonQt.Qt++
        #- PythonQt.QtCore.md:
        #          - PythonQt.QtCore++
        - PythonQt.QtGui.md:
                  - PythonQt.QtGui++
        - PythonQt.QtOpenGL.md:
                  - PythonQt.QtOpenGL++
        - PythonQt.QtSvg.md:
                  - PythonQt.QtSvg++
        - PythonQt.QtUiTools.md:
                  - PythonQt.QtUiTools++
        - PythonQt.QtXml.md:
                  - PythonQt.QtXml++
        - PythonQt.QtXmlPatterns.md:
                  - PythonQt.QtXmlPatterns++

pages:
        - Home: index.md << srcdocs/docs/index.md
        - PythonQt: PythonQt.md
        - Qt: PythonQt.Qt.md
        - QtCore: PythonQt.QtCore.md
        - QtGui: PythonQt.QtGui.md
        - QtOpenGL: PythonQt.QtOpenGL.md
        - QtSvg: PythonQt.QtSvg.md
        - QtUiTools: PythonQt.QtUiTools.md
        - QtXml: PythonQt.QtXml.md
        - QtXmlPatterns: PythonQt.QtXmlPatterns.md
        - private: PythonQt.private.md

extra_javascript:
  - https://i.fontlab.com/fltheme26/1.0.0/basecoat.js
  - https://i.fontlab.com/fltheme26/1.0.0/theme.js

hooks:
  - search_compat.py

site_url: https://fontlabcom.github.io/fontlab-python-docs/pythonqt/
