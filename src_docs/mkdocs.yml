# this_file: src_docs/mkdocs.yml
site_name: FontLab Python
site_description: Native Python APIs, remote control, Qt interfaces, and the FontLab
  scripting ecosystem.
site_url: https://fontlabcom.github.io/fontlab-python-docs/
repo_url: https://github.com/fontlabcom/fontlab-python-docs
edit_uri: ''
use_directory_urls: false
docs_dir: md
site_dir: ../docs
theme:
  name: materialx
  custom_dir: ../overrides
  search_index_only: true
  features:
  - navigation.tabs
  - navigation.sections
  - navigation.top
  - content.code.copy
  - navigation.path
  palette:
  - media: '(prefers-color-scheme: light)'
    scheme: default
    primary: indigo
    toggle:
      icon: material/weather-night
      name: Switch to dark mode
  - media: '(prefers-color-scheme: dark)'
    scheme: slate
    primary: indigo
    toggle:
      icon: material/weather-sunny
      name: Switch to light mode
not_in_nav: 'reference/**

  '
validation:
  nav:
    omitted_files: info
  links:
    not_found: warn
    anchors: warn
markdown_extensions:
- attr_list
- md_in_html
- tables
- admonition
- pymdownx.details
- pymdownx.superfences
- pymdownx.highlight
- pymdownx.inlinehilite
- pymdownx.tabbed:
    alternate_style: true
- pymdownx.tasklist:
    custom_checkbox: true
plugins:
- /search:
    lang: en
    separator: '[\s\-]+'
- autorefs
- materialx/meta
- materialx/tags
- awesome-nav
- categories:
    base_name: topics
    no_nav: true
    show_breadcrumbs: true
- codeinclude:
    title_mode: mkdocs-material
    block_throw: true
- include-markdown:
    comments: false
- live-edit:
    user_docs_dir: src_docs/md
- mkdocstrings:
    handlers:
      python:
        paths: []
        options:
          allow_inspection: false
          extensions:
          - scripts.docstring_literals.LiteralIndexes
          preload_modules:
          - fontlab_echopy
          docstring_style: null
          show_source: false
          show_attribute_values: false
          show_bases: false
          show_root_full_path: false
          show_signature_annotations: true
          separate_signature: true
          signature_crossrefs: true
          merge_init_into_class: false
          inherited_members: false
extra_css:
- https://i.fontlab.com/fltheme26/1.0.0/components.css
- https://i.fontlab.com/fltheme26/1.0.0/theme.css
- assets/reference.css
extra_javascript:
- https://i.fontlab.com/fltheme26/1.0.0/basecoat.js
- https://i.fontlab.com/fltheme26/1.0.0/theme.js
