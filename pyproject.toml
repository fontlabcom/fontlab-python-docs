# this_file: pyproject.toml

[project]
name = "fontlab-python-docs"
version = "0.1.0"
description = "Build metadata for FontLab Python API documentation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "properdocs==1.6.7",
    "mkdocs-materialx==10.1.5",
    "pymdown-extensions>=10.2",
    "mkdocstrings==1.0.7",
    "mkdocstrings-python==2.0.9",
    "mkdocs-autorefs==1.4.4",
    "griffe==2.3.2",
    "mkdocs-codeinclude-plugin==0.3.1",
    "mkdocs-awesome-nav==3.3.0",
    "mkdocs-live-edit-plugin==0.4.1",
    "mkdocs-categories-plugin==0.6.0",
    "mkdocs-include-markdown-plugin==7.3.0",
]

[dependency-groups]
dev = ["pytest>=8", "playwright>=1.55"]

[tool.uv]
package = false

[tool.pytest.ini_options]
markers = ["browser: requires installed Playwright Chromium (launch failures are errors)"]
